<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serpentina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA INICIAL -->
    <div id="inicio" class="tela">
        <div class="conteudo-inicio">
            <h1>SERPENTINA</h1>
            <p>Coma, cresça e evolua!</p>
            <button onclick="mostrarEscolha()">JOGAR</button>
        </div>
    </div>

    <!-- ESCOLHA DA MINHOCA -->
    <div id="escolha" class="tela escondido">
        <h1>ESCOLHA SUA MINHOCA</h1>

        <div class="opcoes">
            <button class="minhoca azul" onclick="selecionarMinhoca('azul')">
                Minhoca Azul
            </button>
            <button class="minhoca laranja" onclick="selecionarMinhoca('laranja')">
                Minhoca Laranja
            </button>
            <button class="minhoca roxa" onclick="selecionarMinhoca('roxa')">
                Minhoca Roxa
            </button>
        </div>

        <p id="selecionada">Escolha uma minhoca!</p>

        <button onclick="mostrarNiveis()">CONTINUAR</button>
        <button onclick="voltarInicio()">VOLTAR</button>
    </div>

    <!-- ESCOLHA DO NÍVEL -->
    <div id="niveis" class="tela escondido">
        <h1>ESCOLHA O NÍVEL</h1>

        <div class="opcoes">
            <button class="nivel" onclick="selecionarNivel(1)">NÍVEL 1<br>FÁCIL</button>
            <button class="nivel" onclick="selecionarNivel(2)">NÍVEL 2<br>MÉDIO</button>
            <button class="nivel" onclick="selecionarNivel(3)">NÍVEL 3<br>DIFÍCIL</button>
        </div>

        <p id="nivelSelecionado">Escolha uma dificuldade!</p>

        <button onclick="iniciarJogo()">PLAY</button>
        <button onclick="voltarEscolha()">VOLTAR</button>
    </div>

    <!-- TELA DO JOGO -->
    <div id="jogo" class="tela escondido">
        <h1>SERPENTINA</h1>

        <div class="informacoes">
            <p>🥕 Cenouras: <span id="cenouras">0</span>/10</p>
            <p>🍔 Largura: <span id="largura">14</span>/40</p>
            <p>Nível: <span id="nivelAtual">1</span></p>
        </div>

        <div class="tabuleiro">
            <canvas id="tela" width="600" height="400"></canvas>
            <canvas id="confetes" width="600" height="400"></canvas>
            <div id="celebracao" class="escondido">
                <h2>VITÓRIA!</h2>
                <p id="mensagem"></p>
                <span>Parabéns, você completou o desafio!</span>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <button onclick="reiniciarJogo()">REINICIAR</button>
            <button onclick="voltarInicio()">MENU</button>
        </div>

        <p>Use as setas do teclado para movimentar.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
